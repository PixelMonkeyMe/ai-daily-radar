              - region "selection.md" [ref=f3e1959]:
                - article [ref=f3e1961]:
                  - generic [ref=f3e1962]:
                    - heading "精选与校准" [level=1] [ref=f3e1963]
                    - 'link "Permalink: 精选与校准" [ref=f3e1964] [cursor=pointer]':
                      - /url: "#精选与校准"
                  - generic [ref=f3e1967]:
                    - heading "一条资料怎么变成精选" [level=2] [ref=f3e1968]
                    - 'link "Permalink: 一条资料怎么变成精选" [ref=f3e1969] [cursor=pointer]':
                      - /url: "#一条资料怎么变成精选"
                  - list [ref=f3e1972]:
                    - listitem [ref=f3e1973]:
                      - strong [ref=f3e1974]: 收进来
                      - text: ：同一网址、同一内容只留一份。普通文章只有标题或摘要时，按信源规则补取正文；视频播放页使用已提供的文字材料，不把播放器页面当正文。没有可信发布时间的资料先不公开，读到原文日期后再判断新旧（见
                      - link "信源" [ref=f3e1975] [cursor=pointer]:
                        - /url: /KKKKhazix/AIHOT/blob/main/docs/sources.md#%E8%A7%84%E5%88%99%E6%97%A7%E6%96%87%E4%B8%8D%E5%88%B7%E5%B1%8F
                      - text: 的“旧文不刷屏”）。
                    - listitem [ref=f3e1976]:
                      - strong [ref=f3e1977]: 预筛
                      - text: （
                      - code [ref=f3e1978]: prefilter.md
                      - text: ）：这是不是本行业的事。宽进，只拦明显无关的：
                      - code [ref=f3e1979]: BLOCK
                      - text: 的资料不出现在任何公开页面；
                      - code [ref=f3e1980]: PASS
                      - text: 和拿不准的
                      - code [ref=f3e1981]: UNKNOWN
                      - text: 继续往下走。只有标题、没有正文、订阅摘要或帖子文字的普通文章先等待材料，不评分、不凭标题写文案，也不进入公开池；材料补齐产生新修订后再判断。可展示的空文字或纯链接原帖沿用原有评分与原样展示规则。
                    - listitem [ref=f3e1982]:
                      - strong [ref=f3e1983]: 评分
                      - text: （
                      - code [ref=f3e1984]: selection-score.md
                      - text: ）：同一份评分标准独立打两次分（0–100）。
                      - strong [ref=f3e1985]: 两次之和 ≥ 2 × 门槛
                      - text: 就够分，门槛按信源分级不同；够分的还要过第 6 步的去重才进精选。页面上显示的分数是两次的平均（向下取整）。
                    - listitem [ref=f3e1986]:
                      - strong [ref=f3e1987]: 结构化
                      - text: （
                      - code [ref=f3e1988]: structure.md
                      - text: ）：和评分同时进行。给出分类和标签（页面上显示的就是这一份）、主体公司，判断这篇是一条具体新闻、讲多件事的综合稿，还是材料不够、说不清；是具体新闻的，抽出它的事实（谁、做了什么、对什么、什么时候）和原文里的出处、前提条件。主题页、事件归组和日报都靠它。
                    - listitem [ref=f3e1989]:
                      - strong [ref=f3e1990]: 写标题摘要
                      - text: ：等结构化完成再写。入选的和差一点入选的（平均分高于
                      - code [ref=f3e1991]: understandFloor
                      - text: ），按
                      - code [ref=f3e1992]: content-understanding.md
                      - text: 写中文标题、答案先行的摘要和推荐理由；其余的按
                      - code [ref=f3e1993]: summarize-*.md
                      - text: 写简短的标题摘要，进“全部动态”。X 帖子没有正文或只含链接时，保留原帖的链接、图片和引用，不调用写作或翻译模型，也不生成“请补充正文”的文案；已经取得实际正文的 X 长文照常处理。写好的文字用了
                      - code [ref=f3e1994]: industry/wording.ts
                      - text: 里列出的词时，再让模型只改这些词一次（
                      - code [ref=f3e1995]: mend-wording.md
                      - text: ）。
                    - listitem [ref=f3e1996]:
                      - strong [ref=f3e1997]: 归组与去重
                      - text: （
                      - code [ref=f3e1998]: group-*.md
                      - text: ）：不同来源报道的同一件事归成一个事件，事件页有综述（
                      - code [ref=f3e1999]: story-digest.md
                      - text: ），“热门”按事件排。修改综述提示词前，可用
                      - link "综述评测" [ref=f3e2000] [cursor=pointer]:
                        - /url: /KKKKhazix/AIHOT/blob/main/docs/story-digest-evaluation.md
                      - text: 在同一批事件上把现有提示词和候选提示词并排比较。分数够了的资料要等归组完成才进精选：模型同时判断它和精选里已有的报道是不是同一条新闻，以及它有没有精选还没给过的具体信息。
                      - list [ref=f3e2001]:
                        - listitem [ref=f3e2002]:
                          - text: 同一条新闻的几篇报道都可以入选：网页上折成一个阅读组；API、RSS 和同步接口每条新闻只出一条，由代表报道出面：官方一手优先；其次是核实过的官方账号（填了
                          - code [ref=f3e2003]: publisherRole
                          - text: 和
                          - code [ref=f3e2004]: owner_entity_id
                          - text: 的
                          - code [ref=f3e2005]: T1_5
                          - text: 账号，新闻的主体正是这家公司，机构先于个人）；再往后是有全文的、分数高的、发得早的。
                        - listitem [ref=f3e2006]: 不是同一条新闻、但没有新信息的（换个说法再介绍一遍已经披露的能力、只是上架到别的平台、只重复已选要点的汇总），不进精选，留在“全部动态”。讲多件事的综合稿不单独成事件，只挂到它提到的事件上，有精选没覆盖的重要内容才入选；材料不够、确认不了是哪条新闻的，不进精选。
                        - listitem [ref=f3e2007]: 显式撤回的报道保留历史归属，但不再参与之后的归组召回、候选代表、事件起点或自动事件比较；同网址及 X 回复／引用也不能借它提供身份依据。同一事实仍有有效报道时使用有效稿，全撤回则暂不召回；恢复公开后可重新参与。只展示摘要或尚未发布的记录不等于撤回，保留原有资格。已有关系和判断不删除，不批量重新归组。
                        - listitem [ref=f3e2008]: 确认之前资料只在“全部动态”里，等得再久也不会自动放行。模型调用失败或回答不合格式，这条资料就停在那里：等待超过 10 分钟会告警，后台“运行”页列出这些资料，可以在后台“内容诊断”里打开这条资料，点“重新归组”。所以归组用的模型要能稳定按格式回答。
                    - listitem [ref=f3e2009]:
                      - strong [ref=f3e2010]: 日报、周报、月报
                      - text: ：
                      - list [ref=f3e2011]:
                        - listitem [ref=f3e2012]:
                          - strong [ref=f3e2013]: 日报
                          - text: 每天 08:00 出（日报、周报、月报的出刊时间在
                          - code [ref=f3e2014]: site/site.ts
                          - text: 的
                          - code [ref=f3e2015]: EDITION_TIMES
                          - text: ，下面按默认值写），覆盖前一天 08:00 到当天 08:00，按规则编排，不调用模型。一件事一条，取报道最多的那条新闻里最权威的一篇，同一事件当天的其他进展列在下面，讲多件事的综合稿挂到它提到的最重要那件事下面。最近 7 期报过的不再出现；报过的事件再有进展，只有当事方自己有新动作（教程、观点这类
                          - code [ref=f3e2016]: commentary
                          - text: 类别不算）、或这条进展有 4 家以上信源报道时才进正文，其余进快讯。没有报道入选、但有官方原帖并且已有 3 个以上独立参与方的事件也会补进来（只进日报，不进精选、不推送）。按重要性排序（入选报道的最高分、当天讨论它的独立参与方、有没有官方原帖，跟进的减分），前 12 条进正文，同一信源最多 2 条，再往后最多 10 条一行快讯。第一条是头条，导语就是它自己的标题和摘要；第 2–4 条是今日看点。
                        - listitem [ref=f3e2017]:
                          - strong [ref=f3e2018]: 周报
                          - text: （每周一 10:00）和
                          - strong [ref=f3e2019]: 月报
                          - text: （每月 1 日 10:30）由这一周、这个月的日报汇编：同一事件跨天只算一件，按日报给它的位置（头条、看点、上了几天）、报道面和评分排序，周报取前 20 件、月报取前 30 件，按日报的分节分栏目。模型（
                          - code [ref=f3e2020]: report-period.md
                          - text: 、
                          - code [ref=f3e2021]: report-period-sections.md
                          - text: ）只写总述和三件以上栏目的一句导读，不增删条目；它写出了条目里没有的名字或数字（拉丁字母的名称、三位以上或带小数点、百分号的数字、词表里的公司），这段话就不用：总述换成按模板生成的一句，栏目不放导读。行业通用词（
                          - code [ref=f3e2022]: taxonomy.ts
                          - text: 的
                          - code [ref=f3e2023]: PLAIN_TERMS
                          - text: ）和站名不受这个限制。
                        - listitem [ref=f3e2024]: 每条精选只进一期：按它的时间算，确认入选比它晚的按确认时间；截止以后才确认的进下一期。
                        - listitem [ref=f3e2025]: 每半小时检查一次：到点的刊期出一次，已经出过的不重写；停机错过的、失败的，在之后的检查里补上。窗口里没有可收的条目时这一期不出，之后每半小时再试，到 10 点还没有当天的日报会告警。
