                  - heading "iFixAi Pro" [level=2] [ref=f2e1224]
                  - 'link "Permalink: iFixAi Pro" [ref=f2e1225] [cursor=pointer]':
                    - /url: "#ifixai-pro"
                - paragraph [ref=f2e1228]: Everything in this repo is our open-source engine. It stays free, with 60 inspections you can run on your own infrastructure using your own model keys.
                - paragraph [ref=f2e1229]:
                  - link "iFixAi Pro" [ref=f2e1230] [cursor=pointer]:
                    - /url: https://www.ifixai.ai/?utm_source=github&utm_medium=readme&utm_content=pro-section#pricing
                  - text: is our independent auditing service for AI agents, with up to 400 inspections.
                - paragraph [ref=f2e1231]: Misalignment is complex. It goes beyond cybersecurity, governance, or getting the job done. Our multifaceted audit combines AI red teaming, governance, operational assurance, and philosophical, ethical, and sociological perspectives to uncover misalignment in your agent’s business context.
                - paragraph [ref=f2e1232]: "You receive two reports: Operational Assurance and Regulatory Compliance. They bring business explanations, gap analysis, and technical evidence together, so business, risk, and engineering teams can understand the findings, their consequences, and what needs fixing."
