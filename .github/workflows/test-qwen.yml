name: Test Qwen API Key

on:
  workflow_dispatch:

jobs:
  test-github-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check QWEN_API_KEY exists
        run: |
          if [ -n "$QWEN_API_KEY" ]; then
            echo "✅ QWEN_API_KEY is set (length: ${#QWEN_API_KEY})"
          else
            echo "❌ QWEN_API_KEY is NOT set"
            exit 1
          fi
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Test Qwen API call
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions \
            -H "Authorization: Bearer $QWEN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen-plus",
              "messages": [{"role":"user","content":"请回复OK"}],
              "max_tokens": 10
            }')
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Qwen API call successful (HTTP 200)"
          else
            echo "❌ Qwen API call failed (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

  test-supabase-secret:
    runs-on: ubuntu-latest
    needs: test-github-secret
    steps:
      - name: Test Qwen via Supabase Edge Function
        run: |
          RESPONSE=$(curl -s https://bvhzexdluniqdwmsxaxw.supabase.co/functions/v1/test-qwen \
            -H "Authorization: Bearer sb_publishable_ZkAEga1YBOmfUrFba7yFYQ_5gt4kkMj")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "success"; then
            echo "✅ Supabase qwen_api_key works"
          else
            echo "❌ Supabase qwen_api_key failed"
            exit 1
          fi
