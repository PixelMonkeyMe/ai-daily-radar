                          - strong [ref=f3e798]: 六种信源
                        - cell "RSS、网页列表、JSON 接口、X 账号、微信公众号，以及你自己脚本推送进来的内容。信源分三级（官方一手、官方账号与准官方、媒体与个人），各级入选门槛不同；抓取频率按产出自动调整" [ref=f3e799]
                      - row [ref=f3e800]:
                        - cell [ref=f3e801]:
                          - strong [ref=f3e802]: 精选
                        - cell "预筛，同一份评分标准独立打两次分，再按信源分级的门槛决定入选；同一条新闻只占一条，换个说法的重复不进。提示词和门槛全部公开，全部可以改；用你自己标注的样本在 SelectBench 里校准" [ref=f3e803]
                      - row [ref=f3e804]:
                        - cell [ref=f3e805]:
                          - strong [ref=f3e806]: 写作
                        - cell "中文标题、答案先行的摘要、推荐理由，外文全文翻译；分类、标签和新闻事实单独抽取；防止模型把原文没提到的公司写进标题" [ref=f3e807]
                      - row [ref=f3e808]:
                        - cell [ref=f3e809]:
                          - strong [ref=f3e810]: 聚簇
                        - cell "不同来源报道的同一件事聚成一个事件，后续进展挂在同一个事件下，事件页有综述；进展和报道时间线可一起切换“最新在前”或“最早在前”；人工改过的归属不会被覆盖" [ref=f3e811]
                      - row [ref=f3e812]:
