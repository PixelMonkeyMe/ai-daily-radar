                    - text: 是我做的一个 AI 热点网站。它每天从一批信源里收资料，用大模型先筛一遍、再独立打两次分，挑出真正值得看的，写成中文标题和摘要；把不同来源说的同一件事聚成一个事件，按有多少人在说排出热点；每天早上出一份日报。
                  - paragraph [ref=f3e726]:
                    - text: 这个仓库是它的引擎和框架：网站、后台、精选流程、聚簇和热度算法，
                    - strong [ref=f3e727]: 所有提示词的原文和入选门槛
                    - text: ，都在这里。
                  - generic [ref=f3e728]:
                    - heading "为什么开源" [level=2] [ref=f3e729]
                    - 'link "Permalink: 为什么开源" [ref=f3e730] [cursor=pointer]':
                      - /url: "#为什么开源"
                  - paragraph [ref=f3e733]: 这半年，很多做法律、做 HR、做金融、做贵金属的朋友问我，能不能也给他们的行业做一个。
                  - paragraph [ref=f3e734]: 我做不了。我不懂你们的行业，不知道哪些信源有用，也不知道什么样的消息，对你们来说才叫热点。
                  - paragraph [ref=f3e735]: 但你们懂。
                  - paragraph [ref=f3e736]: 既然我没办法满足所有人，那就把火种交到大家自己手上。
                  - generic [ref=f3e737]:
                    - heading "说在前面" [level=2] [ref=f3e738]
                    - 'link "Permalink: 说在前面" [ref=f3e739] [cursor=pointer]':
                      - /url: "#说在前面"
                  - list [ref=f3e742]:
                    - listitem [ref=f3e743]:
                      - strong [ref=f3e744]: 我不是专业的开发者。
                      - text: 我是设计师出身，半年前还看不太懂代码。这套代码是我和 AI 一起重写的，比以前干净了很多，但一定还有写得不好的地方。发现问题欢迎提 Issue，我不一定能很快回复，先说声抱歉。
                    - listitem [ref=f3e745]:
                      - strong [ref=f3e746]: 这是 AIHOT 的引擎。
                      - text: 它和 AIHOT 线上跑的是同一份引擎代码，同步时直接从线上导出，不是精心打磨的通用框架。以后 AIHOT 的更新，我会尽量同步过来，但没法保证每一次都同步。模型榜、Codex 重置监控、主题页的大事记这些只对 AI 行业有意义的功能，以及 AIHOT 自己的运营工具，只留在 AIHOT 上。
                    - listitem [ref=f3e747]:
                      - strong [ref=f3e748]: 里面没有 AIHOT 的信源名单和运营数据。
                      - text: 仓库带了 18 个公开的海外 AI 资讯源做示范，够你跑起来看效果；真正的信源，要换成你自己行业的。
                    - listitem [ref=f3e749]:
                      - strong [ref=f3e750]: 请不要用 AIHOT 的名字和 Logo。
                      - text: 换上你自己的名字，它就是你的站。
                  - generic [ref=f3e751]:
                    - heading "它是怎么工作的" [level=2] [ref=f3e752]
                    - 'link "Permalink: 它是怎么工作的" [ref=f3e753] [cursor=pointer]':
                      - /url: "#它是怎么工作的"
                  - img "六步：采集、预筛、两次评分、写作、聚簇、热点与成刊" [ref=f3e758]
                  - paragraph [ref=f3e759]:
                    - text: 一条资料从信源进来，先判重，再预筛；可能重要的独立打两次分，写好中文标题和摘要，和别的报道聚成事件，算进热度。X 帖子没有正文或只有链接时，保留原帖的链接和图片，不调用写作或翻译模型。分数过了门槛、又不是精选里已有新闻的重复，才进精选；日报按规则编出当天要闻，周报、月报再从日报里汇编。每一步的提示词都在
                    - link [ref=f3e760] [cursor=pointer]:
                      - /url: /KKKKhazix/AIHOT/blob/main/industry/prompts
                      - code [ref=f3e761]: industry/prompts/
                    - text: ，改标准不用改代码。详见
                    - link "精选与校准" [ref=f3e762] [cursor=pointer]:
                      - /url: /KKKKhazix/AIHOT/blob/main/docs/selection.md
                    - text: 。
                  - generic [ref=f3e763]:
                    - heading "聚簇与热点" [level=3] [ref=f3e764]
                    - 'link "Permalink: 聚簇与热点" [ref=f3e765] [cursor=pointer]':
                      - /url: "#聚簇与热点"
                  - img "五个来源的报道聚成一个事件，事件进入当前热点榜" [ref=f3e770]
                  - paragraph [ref=f3e771]:
                    - text: 同一件事，官网发一篇、媒体转十篇、X 上吵一天，读者只需要看到一次。AIHOT 把它们聚成一个
                    - strong [ref=f3e772]: 事件
                    - text: ：先用标题摘要的向量（没配向量服务时比文字重合度）在最近两周里找候选，再让模型判断是同一件事、后续进展，还是两件事；拿不准的合并，写入前再让模型复核一遍（复核可以单独换一家模型，设
                    - code [ref=f3e773]: GROUP_REVIEW_MODEL
                    - text: ）。
                  - paragraph [ref=f3e774]:
                    - strong [ref=f3e775]: 热度
                    - text: 按事件算，不按文章算：48 小时内，每个独立来源只算一次，24 小时减半。重复抓取不会多算，一家媒体发十篇也只算一次，所以排在前面的，是真正有很多人在说的事。
                  - generic [ref=f3e776]:
                    - heading "速度" [level=3] [ref=f3e777]
                    - 'link "Permalink: 速度" [ref=f3e778] [cursor=pointer]':
                      - /url: "#速度"
                  - img "AIHOT 线上实测：页面中位数 10 毫秒，95% 在 50 毫秒内；接口中位数 6 毫秒，95% 在 12 毫秒内；文章页 95% 在 14 毫秒内" [ref=f3e783]
