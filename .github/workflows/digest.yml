name: 周期汇总（周报/月报/季报）

on:
  schedule:
    - cron: "30 1 * * 1"        # 每周一 09:30 北京时间 → 周报
    - cron: "30 1 1 * *"        # 每月 1 号 09:30 北京时间 → 月报
    - cron: "30 1 1 1,4,7,10 *" # 每季度首月 1 号 → 季报（与月报同一天，会先生成月报再生季报）
  workflow_dispatch:
    inputs:
      range_type:
        description: "汇总类型"
        type: choice
        options: [weekly, monthly, quarterly, custom]
        default: weekly
      start_date:
        description: "开始日期（仅 custom 必填，格式 2026-09-01）"
        required: false
      end_date:
        description: "结束日期（仅 custom 必填，格式 2026-09-21）"
        required: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成周期汇总
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          EVENT: ${{ github.event_name }}
          RANGE_TYPE: ${{ github.event.inputs.range_type }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$RANGE_TYPE" = "custom" ]; then
              python scripts/make_digest.py --type custom --start "$START_DATE" --end "$END_DATE"
            else
              python scripts/make_digest.py --type "$RANGE_TYPE"
            fi
          else
            DOW=$(date +%u); DOM=$(date +%d); MON=$(date +%m)
            [ "$DOW" = "1" ] && python scripts/make_digest.py --type weekly || true
            [ "$DOM" = "01" ] && python scripts/make_digest.py --type monthly || true
            if [ "$DOM" = "01" ] && ([ "$MON" = "01" ] || [ "$MON" = "04" ] || [ "$MON" = "07" ] || [ "$MON" = "10" ]); then
              python scripts/make_digest.py --type quarterly || true
            fi
          fi

      - name: 生成网页
        run: python scripts/build_site.py

      - name: 提交汇总结果
        run: |
          git config user.name "ai-daily-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/digests docs
          git commit -m "周期汇总 $(date +%F)" || echo "无新内容，跳过提交"
          git push
